spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/attendance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.example.attendance: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
